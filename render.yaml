# Render Blueprint — https://render.com/docs/blueprint-spec
#
# 적용: Render 대시보드 > New > Blueprint > 이 저장소 선택.
#
# ⚠ 이 파일은 Blueprint 로 만든 서비스에만 적용된다. 대시보드에서 손으로 만든 서비스는
#   자기 Build Command(기본값 `yarn`)를 계속 쓴다 — 커밋으로는 못 바꾼다.
#   그 경우를 위해 `yarn` 이 그대로 돌아도 빌드되도록 루트 package.json 의 postinstall 훅을
#   걸어 뒀다(scripts/render-postinstall.mjs). 자세한 내용은 docs/DEPLOYMENT.md Phase 2.
#
# 정적 프런트와 API 가 서로 다른 오리진에 뜨므로 두 가지를 반드시 맞춰야 한다.
#   1) web 의 VITE_API_BASE / VITE_WS_BASE  -> api 서비스 URL
#   2) api 의 CORS_ORIGINS                  -> web 서비스 URL
# 값이 서비스 URL 에 의존해서 자동 주입이 안 된다(sync: false). 첫 배포 때 입력한다.

services:
  # ── FastAPI: 게임 서버(REST + WebSocket) ─────────────────────
  - type: web
    name: bullet-brak-api
    runtime: docker
    region: singapore
    # free 는 15분 유휴 시 슬립한다 = 진행 중이던 방과 WebSocket 이 전부 끊긴다.
    # 실제로 사람을 붙일 거면 starter 이상으로 올릴 것.
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Dockerfile 의 CMD 가 8000 에 바인딩하므로 Render 에도 같은 포트를 알려준다.
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      # 예) https://bullet-brak-web.onrender.com  (쉼표로 여러 개, 끝에 / 붙이지 말 것)
      - key: CORS_ORIGINS
        sync: false
      # Render 는 드라이버 없는 postgresql://... 를 준다. 서버가 기동 시
      # postgresql+asyncpg:// 로 바꾸고 sslmode 파라미터도 정리한다(app/config.py).
      # 이 블록을 지우면 계정 기능만 꺼진 채(인메모리) 그대로 뜬다.
      - key: DATABASE_URL
        fromDatabase:
          name: bullet-brak-db
          property: connectionString
    # ⚠ 인스턴스를 2개 이상으로 올리지 말 것. 방 상태가 프로세스 메모리에 있어서
    #   같은 방 플레이어가 다른 인스턴스에 붙으면 게임이 갈라진다. docs/DEPLOYMENT.md §2

  # ── React 정적 번들 ──────────────────────────────────────────
  - type: web
    name: bullet-brak-web
    runtime: static
    # 기본값 `yarn` 대신 pnpm 스크립트를 쓴다. 이게 이 파일의 핵심이다.
    buildCommand: ./scripts/render-build.sh
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    envVars:
      # 예) https://bullet-brak-api.onrender.com
      - key: VITE_API_BASE
        sync: false
      # 예) wss://bullet-brak-api.onrender.com   (https 사이트에서는 반드시 wss)
      - key: VITE_WS_BASE
        sync: false
    routes:
      # SPA 폴백. 지금은 라우터가 없어 화면이 스토어 상태로만 갈리지만,
      # 나중에 딥링크(/room/ABC123)를 붙여도 새로고침이 404 나지 않는다.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, immutable, max-age=31536000
      - path: /index.html
        name: Cache-Control
        value: no-cache

# ── Postgres (계정/코인 영속화) ────────────────────────────────────────
# 마이그레이션은 api 가 기동할 때 스스로 돌린다(alembic upgrade head).
# Render 에 별도 job 을 만들 필요가 없고, compose 배포와 동작이 같아진다.
#
# ⚠ free 플랜 DB 는 생성 후 30일이 지나면 만료돼 삭제된다. 실제로 데이터를 지킬
#   거면 유료 플랜으로 올릴 것. 만료돼도 api 는 죽지 않고 인메모리 모드로 떨어진다.
databases:
  - name: bullet-brak-db
    databaseName: bulletbrak
    user: bulletbrak
    region: singapore # api 와 같은 리전이어야 내부 네트워크로 붙는다
    plan: free
    postgresMajorVersion: '17'
    ipAllowList: [] # 외부 접속 차단. 같은 리전의 Render 서비스만 붙는다.
