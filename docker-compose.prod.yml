# 운영에 가까운 스택: 정적 번들을 nginx 가 서빙하고 /api, /ws 를 api 로 프록시.
#   make prod-up   (docker compose -f docker-compose.prod.yml up -d --build)
# 진입점은 web 하나뿐이다: http://localhost:8080
name: bullet-brak-prod

services:
  api:
    build:
      context: ./apps/api
      target: runtime
    environment:
      DEBUG: 'false'
      # nginx 를 거쳐 동일 오리진으로 들어오므로 CORS 는 사실상 불필요하다.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    expose:
      - '8000'
    restart: unless-stopped
    # ⚠ 절대 replicas 를 늘리지 말 것. 방 상태가 프로세스 메모리에 있다.
    #   수평 확장 방법은 docs/DEPLOYMENT.md Phase 3 참고.
    deploy:
      replicas: 1
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    ports:
      - '${WEB_PROD_PORT:-8080}:80'
    depends_on:
      - api
    restart: unless-stopped

