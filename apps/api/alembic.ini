# Alembic config. Run from apps/api.
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "description"
#
# Inside the container:  docker compose exec api alembic upgrade head
# Or via make:           make migrate / make migration m="description"
#
# The app runs `upgrade head` itself on startup (app/db/session.py), so you only
# need this CLI when authoring a new revision.
#
# `sqlalchemy.url` is intentionally empty: env.py reads DATABASE_URL through
# app.config and normalizes it for asyncpg. Setting it here would drift per env.
#
# NOTE: keep this file ASCII-only. Alembic reads it with configparser using the
# *locale* encoding, so non-ASCII comments crash on non-UTF-8 consoles (e.g.
# cp949 on Korean Windows). Korean notes live in app/db/migrations/env.py.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
