<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullet Brak - Lobby</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

      :root {
        --bg-dark: #0b0f1a;
        --bg-soft: #111a2e;
        --card-main: #1b2438;
        --card-deep: #151c2f;
        --text-main: #f1f3f5;
        --text-muted: #9aa4b2;
        --accent: #5de2dd;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1c2640 0%, #0f1526 50%, #0a0f1b 100%);
        color: var(--text-main);
        font-family: "Outfit", "Pretendard", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .screen {
        width: min(980px, 92vw);
        display: none;
      }

      .screen.active {
        display: block;
      }

      .lobby-wrap {
        text-align: center;
      }

      .lobby-title {
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 24px;
        letter-spacing: 0.02em;
      }

      .lobby-card {
        background: linear-gradient(160deg, var(--card-main), var(--card-deep));
        border-radius: 24px;
        padding: 32px 36px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .nickname-input {
        width: min(520px, 100%);
        background: #12192b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-main);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 18px;
      }

      .label {
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 12px;
      }

      .customize-layout {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
        align-items: flex-start;
        justify-content: center;
      }

      .preview-box {
        background: #0e1524;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        width: 200px;
        height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      #previewCanvas {
        width: 150px;
        height: 150px;
      }

      .options-box {
        flex: 1;
        max-width: 400px;
        background: #0e1524;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .option-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
      }

      .tab-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
      }

      .tab-btn.active {
        color: var(--accent);
        background: rgba(93, 226, 221, 0.1);
      }

      .option-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        max-height: 240px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .grid-item {
        aspect-ratio: 1/1;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        transition: background 0.2s, border-color 0.2s;
      }

      .grid-item:hover {
        background: rgba(255,255,255,0.1);
      }

      .grid-item.selected {
        border-color: var(--accent);
        background: rgba(93, 226, 221, 0.1);
        box-shadow: 0 0 10px var(--accent);
      }

      .grid-item.color-item {
        border-radius: 50%;
        border: 2px solid transparent;
      }

      .grid-item.color-item.selected {
        border-color: white;
        box-shadow: 0 0 12px rgba(255,255,255,0.5);
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .btn {
        border: none;
        color: #0b0f1a;
        padding: 12px 22px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        width: auto;
      }

      .btn.large {
        width: 100%;
        padding: 16px;
        font-size: 1.1rem;
      }

      .btn.teal { background: #4fd1c5; }
      .btn.coral { background: #ff6b6b; }
      .btn.green { background: #51cf66; }
      .btn.purple { background: #9b6dff; }
      .btn.blue { background: #4f8cff; }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
      }

      .code-area {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .room-code-box {
        background: #0e1524;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #ffd43b;
        border-radius: 12px;
        padding: 10px 24px;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 4px;
      }

      .player-list {
        margin: 24px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 40px;
      }

      .player-item {
        color: #ff8787;
        font-weight: 600;
        font-size: 1.2rem;
      }

      .actions.vertical {
        flex-direction: column;
        gap: 12px;
      }
        transform: translateY(-2px);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
      }

      .code-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      #roomCodeInput {
        width: 160px;
        text-align: center;
        letter-spacing: 4px;
        background: #0e1524;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text-main);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .status {
        margin-top: 12px;
        color: #ff8787;
      }

      .room-info {
        margin-top: 6px;
        color: #74c0fc;
        font-weight: 600;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        color: var(--text-muted);
      }

      #gameCanvas {
        background: #121621;
        border-radius: 16px;
        border: 2px solid rgba(255, 255, 255, 0.08);
        width: 800px;
        height: 600px;
        cursor: crosshair;
      }

      .intro {
        color: var(--text-muted);
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="lobby" class="screen active">
      <div class="lobby-wrap">
        <div class="lobby-title">🎮 협동 게임</div>
        <div class="lobby-card">
          <input id="nicknameInput" class="nickname-input" placeholder="닉네임 입력" maxlength="12" />
          <div class="label">캐릭터 꾸미기:</div>
          
          <div class="customize-layout">
            <div class="preview-box">
              <canvas id="previewCanvas" width="150" height="150"></canvas>
            </div>
            <div class="options-box">
              <div class="option-tabs">
                <button class="tab-btn active" data-category="eyes">EYES</button>
                <button class="tab-btn" data-category="mouths">MOUTHS</button>
                <button class="tab-btn" data-category="details">DETAILS</button>
                <button class="tab-btn" data-category="colors">COLORS</button>
              </div>
              <div id="optionGrid" class="option-grid">
                <!-- Items will be injected here -->
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="createRoomBtn" class="btn teal">방 만들기</button>
            <button id="joinRoomBtn" class="btn coral">방 참가하기</button>
            <button id="soloBtn" class="btn green">훈련장</button>
          </div>
          <div class="code-area">
            <label for="roomCodeInput">초대 코드 (6자리 숫자)</label>
            <input id="roomCodeInput" maxlength="6" inputmode="numeric" placeholder="123456" />
          </div>
          <div class="code-area">
            <label for="maxPlayersSelect">최대 인원: </label>
            <select id="maxPlayersSelect" class="btn" style="background: #1b2438; color: white; border: 1px solid rgba(255,255,255,0.2);">
                <option value="2">2명</option>
                <option value="4">4명</option>
                <option value="6">6명</option>
                <option value="8">8명</option>
            </select>
          </div>
          <div id="lobbyStatus" class="status"></div>
          <div id="roomInfo" class="room-info"></div>
        </div>
      </div>
    </div>

    <div id="roomLobby" class="screen">
      <div class="lobby-wrap">
        <div class="lobby-title">대기실</div>
        <div class="lobby-card">
          <div class="code-area">
            <span class="label">방 코드:</span>
            <div id="roomLobbyCode" class="room-code-box">000000</div>
          </div>
          <div id="roomLobbyCount" class="room-info">플레이어: 1 / 2명</div>
          
          <div id="playerList" class="player-list">
            <!-- 플레이어 닉네임이 여기에 표시됩니다 -->
          </div>

          <div class="actions vertical">
            <button id="enterGameBtn" class="btn teal large">게임 시작</button>
            <button class="btn purple large">맵 에디터</button>
            <button class="btn blue large">맵 불러오기</button>
            <button id="roomLobbyLeaveBtn" class="btn coral" style="margin-top: 20px;">나가기</button>
          </div>
        </div>
      </div>
    </div>

    <div id="game" class="screen">
      <div class="hud">
        <div id="roomCodeDisplay"></div>
        <div id="playerCountDisplay"></div>
        <button id="leaveBtn" class="btn coral">로비로</button>
      </div>
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <p class="intro">조작: A/D 이동, 스페이스 점프, 마우스 조준, 좌클릭 사격</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
