<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullet Brak - Lobby</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

      :root {
        --bg-dark: #0b0f1a;
        --bg-soft: #111a2e;
        --card-main: #1b2438;
        --card-deep: #151c2f;
        --text-main: #f1f3f5;
        --text-muted: #9aa4b2;
        --accent: #5de2dd;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1c2640 0%, #0f1526 50%, #0a0f1b 100%);
        color: var(--text-main);
        font-family: "Outfit", "Pretendard", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .screen {
        width: min(980px, 92vw);
        display: none;
      }

      .screen.active {
        display: block;
      }

      .lobby-wrap {
        text-align: center;
      }

      .lobby-title {
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 24px;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }

      .coin-display {
        font-size: 1rem;
        background: rgba(255, 212, 59, 0.2);
        color: #ffd43b;
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid #ffd43b;
      }

      .lobby-card {
        background: linear-gradient(160deg, var(--card-main), var(--card-deep));
        border-radius: 24px;
        padding: 32px 36px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .nickname-input {
        width: min(520px, 100%);
        background: #12192b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-main);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 18px;
      }

      .label {
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 12px;
      }

      .customize-layout {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
        align-items: flex-start;
        justify-content: center;
      }

      .preview-box {
        background: #0e1524;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        width: 200px;
        height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      #previewCanvas {
        width: 150px;
        height: 150px;
      }

      .options-box {
        flex: 1;
        max-width: 400px;
        background: #0e1524;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .option-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
      }

      .tab-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
      }

      .tab-btn.active {
        color: var(--accent);
        background: rgba(93, 226, 221, 0.1);
      }

      .option-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        max-height: 240px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .grid-item {
        aspect-ratio: 1/1;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        transition: background 0.2s, border-color 0.2s;
      }

      .grid-item:hover {
        background: rgba(255,255,255,0.1);
      }

      .grid-item.selected {
        border-color: var(--accent);
        background: rgba(93, 226, 221, 0.1);
        box-shadow: 0 0 10px var(--accent);
      }

      .grid-item.color-item {
        border-radius: 50%;
        border: 2px solid transparent;
      }

      .grid-item.color-item.selected {
        border-color: white;
        box-shadow: 0 0 12px rgba(255,255,255,0.5);
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .actions.vertical {
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .btn {
        border: none;
        color: #0b0f1a;
        padding: 12px 22px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        text-decoration: none;
        display: inline-block;
      }

      .btn.large {
        width: 100%;
        max-width: 400px;
        padding: 16px;
        font-size: 1.1rem;
      }

      .btn.teal { background: #4fd1c5; }
      .btn.coral { background: #ff6b6b; }
      .btn.green { background: #51cf66; }
      .btn.purple { background: #9b6dff; }
      .btn.blue { background: #4f8cff; }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
      }

      .code-area {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .room-code-box {
        background: #0e1524;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #ffd43b;
        border-radius: 12px;
        padding: 10px 24px;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 4px;
      }

      .player-list {
        margin: 24px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 40px;
      }

      .player-item {
        color: #ff8787;
        font-weight: 600;
        font-size: 1.2rem;
      }

      .status {
        margin-top: 12px;
        color: #ff8787;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        color: var(--text-muted);
      }

      #gameCanvas {
        background: #121621;
        border-radius: 16px;
        border: 2px solid rgba(255, 255, 255, 0.08);
        width: 800px;
        height: 600px;
        cursor: crosshair;
      }

      /* Game UI Overlays */
      .game-container {
        position: relative;
        width: 800px;
        margin: 0 auto;
      }

      .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(10, 15, 26, 0.9);
        backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        border-radius: 16px;
      }

      .overlay.active { display: flex; }

      .picking-title {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: 4px;
        margin-bottom: 40px;
        color: white;
        text-shadow: 0 0 20px rgba(93, 226, 221, 0.5);
      }

      .card-container {
        position: relative;
        width: 100%;
        height: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card-item {
        position: absolute;
        background: #1b2438;
        border: 4px solid var(--accent);
        border-radius: 12px;
        padding: 20px;
        width: 160px;
        height: 240px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }

      .card-item:hover {
        transform: scale(1.15) translateY(-30px) !important;
        z-index: 150 !important;
        background: #252f4a;
        box-shadow: 0 0 40px var(--accent-glow, rgba(93, 226, 221, 0.4));
      }

      .card-item .card-category {
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
      }

      .card-item .card-icon {
        font-size: 3rem;
        margin: 20px 0;
      }

      .card-name { font-weight: 700; font-size: 1.2rem; color: #fff; margin-bottom: 8px; text-transform: uppercase; }
      .card-desc { font-size: 0.9rem; color: var(--text-main); line-height: 1.4; opacity: 0.9; }

      .chat-box {
        position: absolute;
        bottom: 110px;
        left: 20px;
        width: 250px;
        height: 180px;
        background: rgba(0,0,0,0.4);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        padding: 8px;
        pointer-events: auto;
      }

      #chatMessages {
        flex: 1;
        overflow-y: auto;
        font-size: 0.85rem;
        margin-bottom: 4px;
        color: #eee;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      #chatInput {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
        outline: none;
      }

      .score-board {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 80px;
        font-size: 2.2rem;
        font-weight: 700;
        text-shadow: 0 4px 8px rgba(0,0,0,0.6);
        pointer-events: none;
        z-index: 10;
      }

      .score-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .round-dots {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }

      .round-dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.1); }
      .round-dot.won { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

      .intro {
        color: var(--text-muted);
        margin-top: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="lobby" class="screen active">
      <div class="lobby-wrap">
        <div class="lobby-title">🚀 Bullet Brak</div>
        <div class="lobby-card">
          <input id="nicknameInput" class="nickname-input" placeholder="닉네임 입력" maxlength="12" />
          <div class="label">캐릭터 꾸미기:</div>
          
          <div class="customize-layout">
            <div class="preview-box">
              <canvas id="previewCanvas" width="150" height="150"></canvas>
            </div>
            <div class="options-box">
              <div class="option-tabs">
                <button class="tab-btn active" data-category="eyes">EYES</button>
                <button class="tab-btn" data-category="mouths">MOUTHS</button>
                <button class="tab-btn" data-category="details">DETAILS</button>
                <button class="tab-btn" data-category="colors">COLORS</button>
              </div>
              <div id="optionGrid" class="option-grid">
                <!-- Items will be injected here -->
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="createRoomBtn" class="btn teal">방 만들기</button>
            <button id="joinRoomBtn" class="btn coral">방 참가하기</button>
            <button id="soloBtn" class="btn green">훈련장</button>
          </div>
          <div class="code-area">
            <label for="roomCodeInput">초대 코드 (6자리 숫자)</label>
            <input id="roomCodeInput" maxlength="6" inputmode="numeric" placeholder="123456" />
          </div>
          <div class="code-area">
            <label for="maxPlayersSelect">최대 인원: </label>
            <select id="maxPlayersSelect" class="btn" style="background: #1b2438; color: white; border: 1px solid rgba(255,255,255,0.2);">
                <option value="2">2명</option>
                <option value="4">4명</option>
                <option value="6">6명</option>
                <option value="8">8명</option>
            </select>
          </div>
          <div id="lobbyStatus" class="status"></div>
          <div id="roomInfo" class="room-info"></div>
        </div>
      </div>
    </div>

    <div id="roomLobby" class="screen">
      <div class="lobby-wrap">
        <div class="lobby-title">대기실</div>
        <div class="lobby-card">
          <div class="code-area">
            <span class="label">방 코드:</span>
            <div id="roomLobbyCode" class="room-code-box">000000</div>
          </div>
          <div id="roomLobbyCount" class="room-info">플레이어: 1 / 2명</div>
          
          <div id="playerList" class="player-list">
            <!-- 플레이어 닉네임이 여기에 표시됩니다 -->
          </div>

          <div class="actions vertical">
            <button id="enterGameBtn" class="btn teal large">게임 시작</button>
            <button class="btn purple large">맵 에디터</button>
            <button class="btn blue large">맵 불러오기</button>
            <button id="roomLobbyLeaveBtn" class="btn coral" style="margin-top: 20px;">나가기</button>
          </div>
        </div>
      </div>
    </div>

    <div id="game" class="screen">
      <div class="hud">
        <div id="roomCodeDisplay"></div>
        <div id="playerCountDisplay"></div>
        <button id="leaveBtn" class="btn coral">나가기</button>
      </div>
      <div class="game-container">
        <div class="score-board">
          <div class="score-item">
            <span id="p1Score">0</span>
            <div id="p1Rounds" class="round-dots">
              <div class="round-dot"></div>
              <div class="round-dot"></div>
            </div>
          </div>
          <span>VS</span>
          <div class="score-item">
            <span id="p2Score">0</span>
            <div id="p2Rounds" class="round-dots">
              <div class="round-dot"></div>
              <div class="round-dot"></div>
            </div>
          </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="cardOverlay" class="overlay">
          <h1 class="picking-title">PICK A CARD</h1>
          <div id="cardContainer" class="card-container">
            <!-- Cards will be injected here -->
          </div>
        </div>

        <div id="gameOverOverlay" class="overlay">
          <h1 id="winnerName" style="color: #ffd43b; font-size: 3rem; margin-bottom: 20px;">WINNER!</h1>
          <div class="actions">
            <button id="playAgainBtn" class="btn teal large">다시 플레이</button>
            <button id="menuBtn" class="btn coral large">메뉴로</button>
          </div>
        </div>

        <div class="chat-box">
          <div id="chatMessages"></div>
          <input id="chatInput" placeholder="메시지 입력..." maxlength="50" />
        </div>
      </div>
      <p class="intro">조작: A/D 이동, 스페이스 점프, 마우스 조준, 좌클릭 사격, 우클릭/Shift 가드 | Enter: 채팅</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
