<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullet Brak - Online Prototype</title>
    <style>
      body {
        margin: 0;
        background: #1e1e24;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: sans-serif;
      }
      h1 { margin: 10px 0; }
      #gameCanvas {
        background: #2b2b36;
        border: 2px solid #fff;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        cursor: crosshair;
      }
      .controls {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        font-size: 1.1em;
      }
    </style>
  </head>
  <body>
    <h1>Bullet Brak (Online MVP)</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="controls">
      <div><strong>조작법:</strong> A D (이동), 스페이스바 (점프), 마우스 방향 (조준), 마우스 좌클릭 (사격)</div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
